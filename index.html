<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4a7ddb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Andy's Grocery List</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; }
.app { max-width: 600px; margin: 0 auto; padding: 1rem; }
.tab-row { display: flex; border-bottom: 1px solid #ddd; margin-bottom: 1.25rem; background: #fff; border-radius: 12px 12px 0 0; padding: 0 1rem; overflow-x: auto; }
.tab { padding: 12px 14px; font-size: 14px; cursor: pointer; color: #888; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; font-weight: 500; }
.category-block { margin-bottom: 1.25rem; }
.category-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin-bottom: 8px; padding-left: 2px; }
.meal-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.meal-btn { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px; font-size: 14px; color: #1a1a1a; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px; min-height: 50px; }
.meal-btn.selected { background: #e8f0fe; border-color: #4a7ddb; color: #1a4ab5; }
.check { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; min-width: 16px; border: 1.5px solid currentColor; border-radius: 3px; font-size: 11px; }
.meal-btn.selected .check::after { content: '✓'; }
.actions { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
.btn { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px 16px; font-size: 14px; color: #1a1a1a; cursor: pointer; flex: 1; text-align: center; min-width: 100px; }
.btn-primary { background: #e8f0fe; border-color: #4a7ddb; color: #1a4ab5; font-weight: 500; }
.btn-copy.copied { background: #e6f9ed; border-color: #3a9e5f; color: #2a7a48; }
.list-section { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 0.875rem 1rem; margin-bottom: 0.875rem; }
.store-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid #f0f0f0; }
.grocery-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
.grocery-item:last-child { border-bottom: none; }
.grocery-item input[type=checkbox] { width: 20px; height: 20px; min-width: 20px; cursor: pointer; accent-color: #4a7ddb; }
.item-text { flex: 1; line-height: 1.4; }
.item-name { font-size: 15px; color: #1a1a1a; display: block; }
.item-meals { font-size: 12px; color: #999; display: block; margin-top: 1px; }
.qty-badge { font-size: 12px; font-weight: 600; color: #fff; background: #4a7ddb; border-radius: 12px; padding: 2px 8px; flex-shrink: 0; min-width: 24px; text-align: center; }
.always-badge { font-size: 11px; color: #888; background: #f5f5f5; border-radius: 4px; padding: 2px 7px; flex-shrink: 0; }
.progress { font-size: 13px; color: #888; margin-bottom: 0.875rem; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; display: inline-block; margin-right: 5px; vertical-align: middle; }
.sync-dot.ok { background: #3a9e5f; }
.sync-dot.err { background: #d9534f; }
.empty-state { color: #888; font-size: 14px; background: #fff; border-radius: 12px; padding: 1.5rem; text-align: center; }
.loading { color: #888; font-size: 14px; text-align: center; padding: 2rem; }
.recipe-list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 15px; }
.recipe-list-item:last-child { border-bottom: none; }
.recipe-list-item .chev { color: #ccc; }
.recipe-back { display: inline-flex; align-items: center; gap: 4px; color: #4a7ddb; font-size: 14px; cursor: pointer; margin-bottom: 12px; }
.recipe-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.recipe-section-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin: 16px 0 8px; }
.recipe-ingredient { padding: 8px 0; border-bottom: 1px solid #f5f5f5; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.recipe-ingredient:last-child { border-bottom: none; }
.badge-group { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; flex-shrink: 0; }
.weight-badge { font-size: 12px; font-weight: 600; color: #fff; background: #3a9e5f; border-radius: 12px; padding: 2px 8px; flex-shrink: 0; min-width: 24px; text-align: center; }
.oz-badge { font-size: 12px; font-weight: 600; color: #fff; background: #d9534f; border-radius: 12px; padding: 2px 8px; flex-shrink: 0; min-width: 24px; text-align: center; }
.recipe-step { padding: 10px 0; border-bottom: 1px solid #f5f5f5; font-size: 14px; line-height: 1.5; white-space: pre-line; }
.recipe-step:last-child { border-bottom: none; }
.recipe-step-num { font-weight: 600; color: #4a7ddb; margin-right: 6px; }
.recipe-nutrition { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.nutrition-pill { background: #f5f5f5; border-radius: 8px; padding: 4px 10px; font-size: 12px; color: #555; }
.nutrition-pill b { color: #1a1a1a; }
</style>
</head>
<body>
<div class="app">
  <div class="tab-row">
    <div class="tab active" onclick="showTab('meals')">Select meals</div>
    <div class="tab" onclick="showTab('list')">Shopping list</div>
    <div class="tab" onclick="showTab('recipes')">Recipes</div>
  </div>
  <div id="tab-meals">
    <div id="meal-categories"><p class="loading">Loading…</p></div>
    <div class="actions">
      <button class="btn btn-primary" onclick="showTab('list')">Generate list ↗</button>
      <button class="btn btn-copy" id="copy-btn" onclick="copyMeals()">Copy meals</button>
      <button class="btn" onclick="clearMeals()">Clear all</button>
    </div>
  </div>
  <div id="tab-list" style="display:none">
    <div id="list-content"></div>
  </div>
  <div id="tab-recipes" style="display:none">
    <div id="recipes-content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ---------- Supabase setup ----------
const SUPABASE_URL = 'https://enhrjsevztpkrdpojyir.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2rrym30N_hgx4Gg6dCDYOw_4lWnVIKu';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- In-memory state (hydrated from Supabase) ----------
let CATEGORIES = [];      // [{label, meals:[names]}]
let RECIPES = {};         // {mealName: {storeName: [{name,qty,unit}]}}
let ALWAYS_BUY = [];      // [names]
let STORE_ORDER = [];     // [names]
let RECIPE_INSTRUCTIONS = {}; // {mealName: instructions text or null}
let RECIPE_NUTRITION = {};    // {mealName: {servings, calories, protein, carbs, fat, satFat} or null}

let selected = new Set();      // selected meal names
let checked = new Set();       // checked item keys ("store::name")
let syncStatus = 'connecting'; // 'connecting' | 'ok' | 'err'
let suppressNextSave = false;  // avoid save-loop when applying a remote update
let saveTimer = null;
let activeRecipe = null;       // meal name currently open in the Recipes tab, or null for the list view

// ---------- Data loading ----------
async function loadCatalog() {
  const [storesRes, catsRes, mealsRes, itemsRes, alwaysRes] = await Promise.all([
    sb.from('stores').select('*').order('sort_order'),
    sb.from('categories').select('*').order('sort_order'),
    sb.from('meals').select('*').order('sort_order'),
    sb.from('recipe_items').select('*'),
    sb.from('always_buy_items').select('*').order('sort_order'),
  ]);
  for (const r of [storesRes, catsRes, mealsRes, itemsRes, alwaysRes]) {
    if (r.error) throw r.error;
  }

  STORE_ORDER = storesRes.data.map(s => s.name);
  ALWAYS_BUY = alwaysRes.data.map(a => a.name);

  const mealsByCat = {};
  const catById = {};
  catsRes.data.forEach(c => { catById[c.id] = c.label; mealsByCat[c.label] = []; });
  const mealNameById = {};
  RECIPE_INSTRUCTIONS = {};
  RECIPE_NUTRITION = {};
  mealsRes.data.forEach(m => {
    mealNameById[m.id] = m.name;
    const label = catById[m.category_id] || 'Other';
    if (!mealsByCat[label]) mealsByCat[label] = [];
    mealsByCat[label].push(m.name);
    RECIPE_INSTRUCTIONS[m.name] = m.instructions || null;
    RECIPE_NUTRITION[m.name] = (m.calories_per_serving != null) ? {
      servings: m.servings, calories: m.calories_per_serving,
      protein: m.protein_g, carbs: m.carbs_g, fat: m.fat_g, satFat: m.sat_fat_g,
    } : null;
  });
  CATEGORIES = catsRes.data.map(c => ({ label: c.label, meals: mealsByCat[c.label] || [] }))
    .filter(c => c.meals.length);

  const storeNameById = {};
  storesRes.data.forEach(s => { storeNameById[s.id] = s.name; });

  RECIPES = {};
  itemsRes.data.forEach(it => {
    const mealName = mealNameById[it.meal_id];
    const storeName = storeNameById[it.store_id];
    if (!mealName || !storeName) return;
    if (!RECIPES[mealName]) RECIPES[mealName] = {};
    if (!RECIPES[mealName][storeName]) RECIPES[mealName][storeName] = [];
    RECIPES[mealName][storeName].push({ name: it.name, qty: Number(it.qty), unit: it.unit || '', grams: (it.grams != null ? Number(it.grams) : null) });
  });
}

async function loadState() {
  const { data, error } = await sb.from('list_state').select('*').eq('id', 'main').single();
  if (error) throw error;
  selected = new Set((data.selected_meal_ids || []).map(id => mealNameById_global[id]).filter(Boolean));
  checked = new Set(data.checked_keys || []);
}

// meal name <-> id maps, needed to store selection as ids (stable even if renamed)
let mealIdByName_global = {};
let mealNameById_global = {};

async function buildMealIdMaps() {
  const { data, error } = await sb.from('meals').select('id,name');
  if (error) throw error;
  mealIdByName_global = {}; mealNameById_global = {};
  data.forEach(m => { mealIdByName_global[m.name] = m.id; mealNameById_global[m.id] = m.name; });
}

// ---------- Persisting state to Supabase ----------
function scheduleSave() {
  if (suppressNextSave) { suppressNextSave = false; return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 400); // debounce rapid taps
}

async function saveState() {
  const selected_meal_ids = [...selected].map(n => mealIdByName_global[n]).filter(id => id !== undefined);
  const checked_keys = [...checked];
  try {
    const { error } = await sb.from('list_state')
      .update({ selected_meal_ids, checked_keys, updated_at: new Date().toISOString() })
      .eq('id', 'main');
    if (error) throw error;
    setSyncStatus('ok');
  } catch (e) {
    console.error('save failed', e);
    setSyncStatus('err');
  }
}

function setSyncStatus(s) {
  syncStatus = s;
  const dot = document.getElementById('sync-dot');
  if (dot) dot.className = 'sync-dot ' + (s === 'ok' ? 'ok' : s === 'err' ? 'err' : '');
}

// ---------- Realtime: pick up changes made on the other device ----------
function subscribeRealtime() {
  sb.channel('list_state-changes')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'list_state', filter: 'id=eq.main' },
      payload => {
        const row = payload.new;
        suppressNextSave = true; // this change came from the server, don't echo it back
        selected = new Set((row.selected_meal_ids || []).map(id => mealNameById_global[id]).filter(Boolean));
        checked = new Set(row.checked_keys || []);
        renderMeals();
        const listVisible = document.getElementById('tab-list').style.display !== 'none';
        if (listVisible) renderList();
        setSyncStatus('ok');
      })
    .subscribe();
}

// ---------- Formatting / combining (unchanged logic) ----------
function formatQty(qty, unit) {
  if (!unit) return qty > 1 ? `x${qty}` : '';
  const n = qty % 1 === 0 ? qty : parseFloat(qty.toFixed(1));
  return `${n} ${unit}`;
}

function formatGrams(grams) {
  if (grams == null) return '';
  const n = grams >= 10 ? Math.round(grams) : parseFloat(grams.toFixed(1));
  return `${n}g`;
}

function formatOz(grams) {
  if (grams == null) return '';
  const oz = grams / 28.3495;
  const n = oz >= 10 ? Math.round(oz) : parseFloat(oz.toFixed(1));
  return `${n} oz`;
}

function buildCombined() {
  const combined = {};
  selected.forEach(meal => {
    const recipe = RECIPES[meal];
    if (!recipe) return;
    Object.entries(recipe).forEach(([store, items]) => {
      if (!combined[store]) combined[store] = {};
      items.forEach(item => {
        if (combined[store][item.name]) {
          combined[store][item.name].qty += item.qty;
          combined[store][item.name].meals.add(meal);
        } else {
          combined[store][item.name] = { qty: item.qty, unit: item.unit, meals: new Set([meal]) };
        }
      });
    });
  });
  return combined;
}

// ---------- Rendering ----------
function renderMeals() {
  document.getElementById('meal-categories').innerHTML = CATEGORIES.map(cat => `
    <div class="category-block">
      <div class="category-label">${cat.label}</div>
      <div class="meal-grid">
        ${cat.meals.map(m => {
          const safe = m.replace(/'/g,"\\'");
          return `<button class="meal-btn${selected.has(m)?' selected':''}" onclick="toggleMeal('${safe}')">
            <span class="check"></span>${m}
          </button>`;
        }).join('')}
      </div>
    </div>`).join('');
}

function toggleMeal(m) {
  selected.has(m) ? selected.delete(m) : selected.add(m);
  renderMeals();
  scheduleSave();
}

function clearMeals() {
  selected.clear(); checked.clear();
  renderMeals();
  scheduleSave();
}

function copyMeals() {
  if (!selected.size) { alert('No meals selected!'); return; }
  const text = "This week I'm eating:\n" + [...selected].map(m=>`- ${m}`).join('\n');
  function flash() {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied! ✓'; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent='Copy meals'; btn.classList.remove('copied'); }, 2000);
  }
  navigator.clipboard.writeText(text).then(flash).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); flash();
  });
}

function showTab(t) {
  document.getElementById('tab-meals').style.display = t==='meals'?'':'none';
  document.getElementById('tab-list').style.display = t==='list'?'':'none';
  document.getElementById('tab-recipes').style.display = t==='recipes'?'':'none';
  const order = ['meals','list','recipes'];
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active', order[i]===t));
  if (t==='list') renderList();
  if (t==='recipes') { activeRecipe = null; renderRecipes(); }
}

// ---------- Recipes tab ----------
function getRecipeList() {
  return Object.keys(RECIPE_INSTRUCTIONS)
    .filter(m => RECIPE_INSTRUCTIONS[m] && RECIPE_INSTRUCTIONS[m].trim())
    .sort((a, b) => a.localeCompare(b));
}

function openRecipe(name) { activeRecipe = name; renderRecipes(); }
function closeRecipe() { activeRecipe = null; renderRecipes(); }

function renderRecipes() {
  const el = document.getElementById('recipes-content');
  if (!activeRecipe) {
    const list = getRecipeList();
    if (!list.length) {
      el.innerHTML = `<p class="empty-state">No recipes added yet.</p>`;
      return;
    }
    el.innerHTML = `<div class="list-section">` + list.map(name => {
      const safe = name.replace(/'/g,"\\'");
      return `<div class="recipe-list-item" onclick="openRecipe('${safe}')"><span>${name}</span><span class="chev">&rsaquo;</span></div>`;
    }).join('') + `</div>`;
    return;
  }

  const name = activeRecipe;
  const recipe = RECIPES[name] || {};
  const steps = (RECIPE_INSTRUCTIONS[name] || '')
    .split(/\n\s*\n/)
    .map(s => s.trim())
    .filter(Boolean);

  let html = `<div class="recipe-back" onclick="closeRecipe()">&larr; All recipes</div>`;
  html += `<div class="recipe-title">${name}</div>`;

  const nut = RECIPE_NUTRITION[name];
  if (nut) {
    html += `<div class="recipe-nutrition">
      <span class="nutrition-pill">Serves <b>${nut.servings}</b></span>
      <span class="nutrition-pill"><b>${nut.calories}</b> cal</span>
      <span class="nutrition-pill"><b>${nut.protein}g</b> protein</span>
      <span class="nutrition-pill"><b>${nut.carbs}g</b> carbs</span>
      <span class="nutrition-pill"><b>${nut.fat}g</b> fat</span>
      <span class="nutrition-pill"><b>${nut.satFat}g</b> sat fat</span>
    </div>`;
  }

  const storesForMeal = Object.keys(recipe);
  if (storesForMeal.length) {
    html += `<div class="recipe-section-label">Ingredients</div><div class="list-section">`;
    storesForMeal.forEach(store => {
      recipe[store].forEach(item => {
        const qtyStr = formatQty(item.qty, item.unit);
        const gramsStr = formatGrams(item.grams);
        const ozStr = formatOz(item.grams);
        const badges = [
          qtyStr ? `<span class="qty-badge">${qtyStr}</span>` : '',
          gramsStr ? `<span class="weight-badge">${gramsStr}</span>` : '',
          ozStr ? `<span class="oz-badge">${ozStr}</span>` : '',
        ].join('');
        html += `<div class="recipe-ingredient"><span>${item.name}</span>${badges ? `<span class="badge-group">${badges}</span>` : ''}</div>`;
      });
    });
    html += `</div>`;
  }

  html += `<div class="recipe-section-label">Steps</div>`;
  html += steps.length
    ? `<div class="list-section">` + steps.map((s,i) => `<div class="recipe-step"><span class="recipe-step-num">${i+1}.</span>${s}</div>`).join('') + `</div>`
    : `<p class="empty-state">No steps yet.</p>`;

  el.innerHTML = html;
}

// key items by store+name so the same ingredient in different stores never collides
function itemKey(store, name) { return store + '::' + name; }

function renderList() {
  const el = document.getElementById('list-content');
  const combined = buildCombined();
  let html = '';

  const dotClass = syncStatus === 'ok' ? 'ok' : syncStatus === 'err' ? 'err' : '';
  const syncLabel = syncStatus === 'ok' ? 'Synced' : syncStatus === 'err' ? 'Sync error' : 'Syncing…';

  if (!selected.size) {
    html = `<p class="progress"><span><span class="sync-dot ${dotClass}" id="sync-dot"></span>${syncLabel}</span></p>`;
    html += `<p class="empty-state">No meals selected — tap "Select meals" to get started.</p>`;
  } else {
    let total = ALWAYS_BUY.filter(i=>!checked.has(itemKey('always', i))).length;
    STORE_ORDER.forEach(s=>{ if(combined[s]) Object.keys(combined[s]).forEach(n=>{ if(!checked.has(itemKey(s,n))) total++; }); });
    html += `<p class="progress"><span><span class="sync-dot ${dotClass}" id="sync-dot"></span>${syncLabel}</span><span>${total} item${total!==1?'s':''} remaining</span></p>`;

    STORE_ORDER.forEach(store => {
      if (!combined[store]) return;
      const unchecked = Object.entries(combined[store]).filter(([n])=>!checked.has(itemKey(store,n)));
      if (!unchecked.length) return;
      html += `<div class="list-section"><div class="store-label">${store}</div>`;
      unchecked.forEach(([name,{qty,unit,meals}]) => {
        const key = itemKey(store, name);
        const domId = 'r' + btoa(unescape(encodeURIComponent(key))).replace(/[^a-zA-Z0-9]/g,'');
        const safeKey = key.replace(/'/g,"\\'");
        const qtyStr = formatQty(qty,unit);
        const mealList = [...meals].join(', ');
        html += `<div class="grocery-item" id="row-${domId}" onclick="toggleCheck('${safeKey}','${domId}')">
          <input type="checkbox" id="${domId}" onclick="event.stopPropagation();toggleCheck('${safeKey}','${domId}')">
          <span class="item-text">
            <span class="item-name">${name}</span>
            ${selected.size>1?`<span class="item-meals">(${mealList})</span>`:''}
          </span>
          ${qtyStr?`<span class="qty-badge">${qtyStr}</span>`:''}
        </div>`;
      });
      html += `</div>`;
    });

    const uncheckedAlways = ALWAYS_BUY.filter(i=>!checked.has(itemKey('always', i)));
    if (uncheckedAlways.length) {
      html += `<div class="list-section"><div class="store-label">Always buy</div>`;
      uncheckedAlways.forEach(item => {
        const key = itemKey('always', item);
        const domId = 'r' + btoa(unescape(encodeURIComponent(key))).replace(/[^a-zA-Z0-9]/g,'');
        html += `<div class="grocery-item" id="row-${domId}" onclick="toggleCheck('${key}','${domId}')">
          <input type="checkbox" id="${domId}" onclick="event.stopPropagation();toggleCheck('${key}','${domId}')">
          <span class="item-text"><span class="item-name">${item}</span></span>
          <span class="always-badge">weekly</span>
        </div>`;
      });
      html += `</div>`;
    }

    if (!total) html += `<p class="empty-state" style="margin-bottom:1rem">🎉 All done!</p>`;
  }

  html += `<div class="actions">
    <button class="btn" onclick="restoreAll()">Restore all</button>
    <button class="btn" onclick="showTab('meals')">Edit meals</button>
  </div>`;
  el.innerHTML = html;
}

function restoreAll() {
  checked.clear();
  renderList();
  scheduleSave();
}

function toggleCheck(key, domId) {
  checked.add(key);
  const row = document.getElementById('row-'+domId);
  if (row) { row.style.transition='opacity 0.2s'; row.style.opacity='0'; setTimeout(()=>renderList(),220); }
  else renderList();
  scheduleSave();
}

// ---------- Boot ----------
async function boot() {
  try {
    await buildMealIdMaps();
    await loadCatalog();
    await loadState();
    setSyncStatus('ok');
    renderMeals();
    subscribeRealtime();
  } catch (e) {
    console.error('boot failed', e);
    document.getElementById('meal-categories').innerHTML =
      '<p class="empty-state">Could not load your data. Check your connection and reload.</p>';
    setSyncStatus('err');
  }
}
boot();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
